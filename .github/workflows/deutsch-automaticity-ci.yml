name: German Automaticity CI

on:
  push:
    branches:
      - main
    paths:
      - "Apps/Deutsch-V10.08.2026/**"
  pull_request:
    paths:
      - "Apps/Deutsch-V10.08.2026/**"

permissions:
  contents: read

defaults:
  run:
    working-directory: Apps/Deutsch-V10.08.2026

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspaces
        run: bun run verify

      - name: Verify API over HTTP
        run: bun run test:integration

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: Verify browser flows
        run: bun run test:e2e

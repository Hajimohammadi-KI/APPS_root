name: German Automaticity CI

on:
  push:
    branches:
      - main
    # This repo holds several independent apps in one monorepo. Scoping
    # `paths` to just this app's directory means a push/PR that only touches
    # a different app (e.g. the PDF Reader or Settings app) will not trigger
    # this workflow at all — each app gets its own CI run, only when its own
    # code actually changes.
    paths:
      - "Apps/Deutsch-V10.08.2026/**"
  pull_request:
    paths:
      - "Apps/Deutsch-V10.08.2026/**"

permissions:
  contents: read

defaults:
  run:
    # Every step below (install, verify, tests) runs with this directory as
    # its cwd. This app is built and tested standalone, with its own
    # package.json/lockfile — it is not part of a shared workspace root — so
    # every command needs to execute from inside the app's own folder.
    working-directory: Apps/Deutsch-V10.08.2026

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify workspaces
        run: bun run verify

      - name: Verify API over HTTP
        run: bun run test:integration

      - name: Verify browser flows
        run: bun run test:e2e

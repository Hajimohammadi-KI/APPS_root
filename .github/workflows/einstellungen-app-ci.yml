name: Settings App CI

on:
  push:
    branches:
      - main
    # This repo holds several independent apps in one monorepo. Scoping
    # `paths` to just this app's directory means a push/PR that only touches
    # a different app (e.g. the PDF Reader or Cross Repository Tracker) will
    # not trigger this workflow at all — each app gets its own CI run, only
    # when its own code actually changes.
    #
    # shared/check-duplicated-files.mjs is also watched even though it lives
    # outside this app's folder: it guards a handful of security-critical
    # files (like the model-config this app shares with the PDF Reader app)
    # that are intentionally duplicated byte-for-byte across this app and
    # the other two instead of living in one shared package. A change to
    # that guard script itself should re-run this app's CI too, since it is
    # one of the apps whose files it checks.
    paths:
      - "Apps/Apps-For-Integeration/Einstellungen-APP/**"
      - "shared/check-duplicated-files.mjs"
  pull_request:
    paths:
      - "Apps/Apps-For-Integeration/Einstellungen-APP/**"
      - "shared/check-duplicated-files.mjs"

permissions:
  contents: read

defaults:
  run:
    # Every step below (install, lint, typecheck, test) runs with this
    # directory as its cwd. This app is built and tested standalone, with
    # its own package.json/lockfile — it is not part of a shared workspace
    # root — so every command needs to execute from inside the app's own
    # folder.
    working-directory: Apps/Apps-For-Integeration/Einstellungen-APP

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

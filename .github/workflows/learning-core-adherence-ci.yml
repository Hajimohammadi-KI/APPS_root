name: Learning Core and Content Quality CI

on:
  push:
    branches:
      - main
    paths:
      - "shared/learning-core/**"
      - "Apps/English/English-07082026/packages/learning-core/**"
      - "Apps/Deutsch-V10.08.2026/packages/learning-core/**"
      - "Apps/English/English-07082026/packages/content/**"
      - "Apps/Deutsch-V10.08.2026/packages/content/**"
      - "Apps/English/English-07082026/apps/web/public/replacements/en/daily.html"
      - "Apps/English/English-07082026/apps/web/features/screens/automaticity-screen.tsx"
      - "Apps/English/English-07082026/apps/web/public/learning-core/forced-output-booster.js"
      - "Apps/English/English-07082026/tests/e2e/forced-output-booster.spec.ts"
      - "Apps/Deutsch-V10.08.2026/apps/web/public/replacements/de/heute.html"
      - "Apps/Deutsch-V10.08.2026/apps/web/src/features/learner-state/learner-state-provider.tsx"
      - "Apps/Deutsch-V10.08.2026/apps/web/public/learning-core/forced-output-booster.js"
      - "Apps/Deutsch-V10.08.2026/apps/web/e2e/forced-output-booster.spec.ts"
      - "docs/automaticity/FORCED-OUTPUT-BOOSTER.md"
      - "docs/automaticity/FSRS-SHADOW-EVALUATION.md"
      - "Apps/English/English-07082026/bun.lock"
      - "Apps/Deutsch-V10.08.2026/bun.lock"
      - ".github/workflows/learning-core-adherence-ci.yml"
  pull_request:
    paths:
      - "shared/learning-core/**"
      - "Apps/English/English-07082026/packages/learning-core/**"
      - "Apps/Deutsch-V10.08.2026/packages/learning-core/**"
      - "Apps/English/English-07082026/packages/content/**"
      - "Apps/Deutsch-V10.08.2026/packages/content/**"
      - "Apps/English/English-07082026/apps/web/public/replacements/en/daily.html"
      - "Apps/English/English-07082026/apps/web/features/screens/automaticity-screen.tsx"
      - "Apps/English/English-07082026/apps/web/public/learning-core/forced-output-booster.js"
      - "Apps/English/English-07082026/tests/e2e/forced-output-booster.spec.ts"
      - "Apps/Deutsch-V10.08.2026/apps/web/public/replacements/de/heute.html"
      - "Apps/Deutsch-V10.08.2026/apps/web/src/features/learner-state/learner-state-provider.tsx"
      - "Apps/Deutsch-V10.08.2026/apps/web/public/learning-core/forced-output-booster.js"
      - "Apps/Deutsch-V10.08.2026/apps/web/e2e/forced-output-booster.spec.ts"
      - "docs/automaticity/FORCED-OUTPUT-BOOSTER.md"
      - "docs/automaticity/FSRS-SHADOW-EVALUATION.md"
      - "Apps/English/English-07082026/bun.lock"
      - "Apps/Deutsch-V10.08.2026/bun.lock"
      - ".github/workflows/learning-core-adherence-ci.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: shared/learning-core

jobs:
  adherence-core:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact learning-core dependencies
        run: bun install --frozen-lockfile

      - name: Type-check pure TypeScript core
        run: bun run typecheck

      - name: Run adherence property and scenario tests
        run: bun run test:adherence-core

      - name: Run forced-output booster contract tests
        run: bun run test:booster

      - name: Run FSRS-6 shadow replay and migration tests
        run: bun run test:fsrs-shadow

      - name: Run complete learning-core tests
        run: bun run test

      - name: Run content quality gate tests
        run: bun run test:content-quality

      - name: Rebuild browser shadow adapter
        run: bun run build:browser

      - name: Reject stale generated browser adapters
        working-directory: .
        run: git diff --exit-code -- shared/learning-core/browser/adherence-shadow.js shared/learning-core/browser/forced-output-booster.js

      - name: Reject stale app mirrors
        run: node sync-workspaces.mjs --check

  content-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app:
          - Apps/English/English-07082026
          - Apps/Deutsch-V10.08.2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        working-directory: ${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Type-check authored content
        working-directory: ${{ matrix.app }}
        run: bun run --cwd packages/content typecheck

      - name: Verify authored content and release quarantine
        working-directory: ${{ matrix.app }}
        run: bun test packages/content/src/content.test.ts

  fsrs-app-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app:
          - Apps/English/English-07082026
          - Apps/Deutsch-V10.08.2026

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        working-directory: ${{ matrix.app }}
        run: bun install --frozen-lockfile

      - name: Type-check FSRS shadow integration
        working-directory: ${{ matrix.app }}
        run: bun run --cwd apps/web typecheck

      - name: Build FSRS shadow integration
        working-directory: ${{ matrix.app }}
        run: bun run --cwd apps/web build

  booster-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app_root: Apps/English/English-07082026
            test_root: Apps/English/English-07082026
            spec: tests/e2e/forced-output-booster.spec.ts
          - app_root: Apps/Deutsch-V10.08.2026
            test_root: Apps/Deutsch-V10.08.2026/apps/web
            spec: e2e/forced-output-booster.spec.ts

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install exact dependencies
        working-directory: ${{ matrix.app_root }}
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: ${{ matrix.app_root }}
        run: bunx playwright install --with-deps chromium

      - name: Build the English API used by its Playwright web server
        if: matrix.app_root == 'Apps/English/English-07082026'
        working-directory: ${{ matrix.app_root }}
        run: bun run --cwd apps/api build

      - name: Verify forced-output booster in the browser
        working-directory: ${{ matrix.test_root }}
        run: bunx playwright test ${{ matrix.spec }}

name: PDF Reader CI

on:
  push:
    branches:
      - main
    paths:
      - "Apps/Apps-For-Integeration/Reader-PDF-App/**"
      - "shared/check-duplicated-files.mjs"
  pull_request:
    paths:
      - "Apps/Apps-For-Integeration/Reader-PDF-App/**"
      - "shared/check-duplicated-files.mjs"

permissions:
  contents: read

defaults:
  run:
    working-directory: Apps/Apps-For-Integeration/Reader-PDF-App

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#38bdf8" />
    <title>DeutschFlow · Offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Aptos, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        color: #102f4f;
        background: #f5fbff;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      main {
        width: min(100%, 32rem);
        border: 1px solid #bae6fd;
        border-radius: 1.25rem;
        background: white;
        padding: 2rem;
        box-shadow: 0 1rem 3rem rgb(14 116 144 / 0.12);
      }
      .mark {
        width: 3rem;
        height: 3rem;
        display: grid;
        place-items: center;
        border-radius: 0.9rem;
        background: #7dd3fc;
        color: #082f49;
        font-weight: 800;
      }
      h1 {
        margin: 1.25rem 0 0.5rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0;
        color: #47657e;
        line-height: 1.6;
      }
      button {
        margin-top: 1.5rem;
        min-height: 2.75rem;
        border: 0;
        border-radius: 0.75rem;
        padding: 0 1rem;
        background: #7dd3fc;
        color: #082f49;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 3px solid #0369a1;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">DF</div>
      <h1>Du bist gerade offline</h1>
      <p>
        Bereits geladene Bereiche und deine lokalen Lerndaten bleiben
        verfügbar. Stelle die Verbindung wieder her und versuche es erneut.
      </p>
      <button type="button" onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>

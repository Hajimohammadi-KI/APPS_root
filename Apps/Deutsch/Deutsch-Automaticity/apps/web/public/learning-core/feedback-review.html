<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>بازبینی کامنت‌ها</title>
    <style>
      :root { color-scheme: light; --ink: #08364a; --teal: #007f83; --line: #cfe3e5; }
      body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 860px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 1.4rem; } h2 { font-size: 1.05rem; color: var(--teal); }
      section { border-top: 2px solid var(--line); margin-top: 20px; padding-top: 8px; }
      article { background: #eaf6f7; border-radius: 10px; padding: 12px; margin: 12px 0; }
      input, select, textarea, button { font: inherit; margin: 4px 0; max-width: 100%; }
      label { display: block; font-size: 0.9rem; margin-top: 6px; }
      button { background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <main>
      <h1>بازبینی کامنت‌های یادگیرندگان</h1>
      <p>فقط شما با کلید بازبینی این فهرست را می‌بینید. هر تصمیم در همان issue خصوصی ثبت می‌شود و تا اجرای اسکریپت واردکردن و انتشار، هیچ نمره یا تمرینی را عوض نمی‌کند. ادعای یادگیرنده به‌تنهایی هرگز پاسخ را درست نمی‌کند.</p>
      <div id="feedback-review"></div>
    </main>
    <script src="/learning-core/feedback-review.js"></script>
  </body>
</html>

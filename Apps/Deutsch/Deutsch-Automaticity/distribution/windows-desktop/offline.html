<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DeutschFlow ist offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f5fbff;
        color: #102a56;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 3rem));
        border: 1px solid #cde7f8;
        border-radius: 1.5rem;
        background: white;
        padding: 2rem;
        box-shadow: 0 1.5rem 4rem rgb(16 42 86 / 12%);
        text-align: center;
      }

      .icon {
        display: grid;
        width: 4rem;
        height: 4rem;
        margin: 0 auto;
        border-radius: 1.25rem;
        place-items: center;
        background: #e0f2fe;
        color: #1760df;
        font-size: 2rem;
      }

      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.75rem;
      }

      p {
        margin: 0.75rem 0 0;
        color: #52647c;
        line-height: 1.7;
      }

      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.875rem;
        background: #1760df;
        padding: 0.8rem 1.2rem;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">↻</div>
      <h1>Keine Internetverbindung</h1>
      <p>
        DeutschFlow konnte noch nicht geladen werden. Stelle die Verbindung
        wieder her und versuche es erneut.
      </p>
      <button
        type="button"
        onclick="
          location.href = 'https://deutschflow-grammar-jjb415sn8.vercel.app/'
        "
      >
        Erneut versuchen
      </button>
    </main>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Content review</title>
    <style>
      :root { color-scheme: light; --ink: #08364a; --teal: #007f83; --line: #cfe3e5; }
      body { margin: 0; background: #fff; color: var(--ink); font: 16px/1.6 system-ui, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 16px; overflow-wrap: anywhere; }
      h1 { font-size: 1.4rem; } h2 { font-size: 1.15rem; color: var(--teal); } h3 { font-size: 1rem; margin-top: 24px; }
      fieldset { border: 1px solid var(--line); border-radius: 10px; margin: 12px 0; padding: 8px 12px; min-width: 0; }
      article { background: #eaf6f7; border-radius: 10px; padding: 12px; margin: 12px 0; }
      label { display: block; font-size: 0.95rem; margin-top: 6px; }
      input:not([type]), select, textarea { font: inherit; width: 100%; box-sizing: border-box; margin: 4px 0; }
      button { font: inherit; background: var(--teal); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; margin: 8px 8px 0 0; }
      button:disabled { opacity: 0.5; }
      .review-prompt { font-weight: 600; } .review-stale, .review-missing { color: #9a3412; }
      .review-exports { border-top: 2px solid var(--line); margin-top: 24px; padding-top: 8px; }
    </style>
  </head>
  <body>
    <main id="content-review"><p>Loading…</p></main>
    <script src="/learning-core/content-review.js"></script>
  </body>
</html>

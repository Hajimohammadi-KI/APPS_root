<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>English Grammar Automaticity is offline</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f8f5fc;
        color: #241b2f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background:
          radial-gradient(
            circle at 18% 12%,
            rgb(21 94 239 / 10%),
            transparent 28rem
          ),
          #f8f5fc;
      }

      main {
        width: min(34rem, calc(100% - 3rem));
        border: 1px solid #ddd2e8;
        border-radius: 1.5rem;
        background: rgb(255 255 255 / 94%);
        padding: 2.25rem;
        box-shadow: 0 1.5rem 4rem rgb(18 33 58 / 12%);
      }

      .mark {
        display: grid;
        width: 4rem;
        height: 4rem;
        border-radius: 1.25rem;
        place-items: center;
        background: #f1eafa;
        color: #493465;
        font-size: 1.65rem;
        font-weight: 800;
      }

      .eyebrow {
        margin: 1.5rem 0 0;
        color: #493465;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.65rem 0 0;
        font-size: clamp(1.75rem, 5vw, 2.35rem);
        letter-spacing: -0.035em;
      }

      p {
        margin: 0.9rem 0 0;
        color: #5c526b;
        line-height: 1.7;
      }

      .actions {
        display: flex;
        gap: 0.75rem;
        margin-top: 1.6rem;
      }

      button {
        border: 1px solid #493465;
        border-radius: 0.8rem;
        background: #493465;
        padding: 0.82rem 1.15rem;
        color: white;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button:hover {
        color: #7a5aa0;
      }

      button.secondary {
        background: transparent;
        color: #493465;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">A→</div>
      <p class="eyebrow">English Grammar Automaticity</p>
      <h1 id="heading">You are currently offline.</h1>
      <p id="detail">
        The learning app could not reach its secure online service. Check your
        connection, then try again. Your saved desktop data remains on this
        computer.
      </p>
      <div class="actions">
        <button type="button" class="secondary" onclick="window.history.back()">
          ← Go back
        </button>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </main>
    <script>
      // did-fail-load in main.cjs passes ?reason=companion when the failed
      // navigation was to one of this suite's other local apps (Tracker,
      // PDF Reader, Settings) rather than a real connectivity problem --
      // most often because that app just isn't running yet.
      if (new URLSearchParams(location.search).get("reason") === "companion") {
        document.getElementById("heading").textContent =
          "A connected app isn't running.";
        document.getElementById("detail").textContent =
          "This feature opens one of the other local study apps (Tracker, PDF Reader, or Settings), " +
          "which isn't currently running. Start it from its own shortcut, or use the Starter App to launch " +
          "all the apps together, then try again.";
      }
    </script>
  </body>
</html>
